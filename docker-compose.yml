services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: client_finder_backend
    restart: always
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/clientfinder
      - MAPS_API_KEY=${MAPS_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}        
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL}  
      - SENDGRID_FROM_NAME=${SENDGRID_FROM_NAME}
      - SECRET_KEY=your-secret-key-here-make-it-long-and-random
      - GMAIL_ADDRESS=usamaarshad1012@gmail.com
      - GMAIL_APP_PASSWORD=stxv dcii evma knad
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - client_finder_net

  frontend:
    build:
      context: ./front_end
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8000/api/v1
    container_name: client_finder_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - client_finder_net

  db:
    image: postgres:15-alpine
    container_name: client_finder_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=clientfinder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d clientfinder" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - client_finder_net

volumes:
  pgdata:


networks:
  client_finder_net:
    driver: bridge
