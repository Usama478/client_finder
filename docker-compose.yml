services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: client_finder_backend
    restart: always
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/clientfinder
      - MAPS_API_KEY=${MAPS_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - VALUESERP_API_KEY=${VALUESERP_API_KEY}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}        
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL}  
      - SENDGRID_FROM_NAME=${SENDGRID_FROM_NAME}
      - SCRAPER_API_KEY=${SCRAPER_API_KEY}
      - HUNTER_API_KEY=${HUNTER_API_KEY}
      - SECRET_KEY=your-secret-key-here-make-it-long-and-random
      - GMAIL_ADDRESS=usamaarshad1012@gmail.com
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - FRONTEND_URL=http://localhost:5173
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379/2
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - client_finder_net

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: client_finder_celery_worker
    restart: always
    # prefork pool is mandatory: verification spawns multiprocessing.Process and
    # the engine uses asyncio.run() — both are fork-safe only under prefork.
    # --concurrency=1 keeps the t2.micro within its 1GB RAM budget.
    command: celery -A app.celery_app:celery_app worker --loglevel=info --concurrency=1 --pool=prefork --max-memory-per-child=400000
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/clientfinder
      - MAPS_API_KEY=${MAPS_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - VALUESERP_API_KEY=${VALUESERP_API_KEY}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL}
      - SENDGRID_FROM_NAME=${SENDGRID_FROM_NAME}
      - SCRAPER_API_KEY=${SCRAPER_API_KEY}
      - HUNTER_API_KEY=${HUNTER_API_KEY}
      - SECRET_KEY=your-secret-key-here-make-it-long-and-random
      - GMAIL_ADDRESS=usamaarshad1012@gmail.com
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - FRONTEND_URL=http://localhost:5173
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379/2
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - client_finder_net

  redis:
    image: redis:7-alpine
    container_name: client_finder_redis
    restart: always
    # noeviction: the broker must never drop queued tasks under memory pressure.
    command: redis-server --maxmemory 128mb --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - client_finder_net

  frontend:
    build:
      context: ./front_end
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000
    container_name: client_finder_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - client_finder_net

  db:
    image: postgres:15-alpine
    container_name: client_finder_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=clientfinder
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d clientfinder" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - client_finder_net

volumes:
  pgdata:


networks:
  client_finder_net:
    driver: bridge
