version: '3.8'

services:
  backend:
    build: .
    # --- DNS FIX ADDED HERE ---
    dns:
      - 8.8.8.8
      - 8.8.4.4
    # --------------------------
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=client_finder
    ports:
      - "5432:5432"

volumes:
  postgres_data: