services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: client_finder_backend
    restart: always
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${UVICORN_WORKERS:-4}"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MAPS_API_KEY=${MAPS_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL}
      - SENDGRID_FROM_NAME=${SENDGRID_FROM_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - GMAIL_ADDRESS=${GMAIL_ADDRESS}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - FRONTEND_URL=${FRONTEND_URL}
      - EMAIL_AGENT_ENABLED=${EMAIL_AGENT_ENABLED}
      - DEFAULT_CREDITS=${DEFAULT_CREDITS}
      - VALUESERP_API_KEY=${VALUESERP_API_KEY}
      - HUNTER_API_KEY=${HUNTER_API_KEY}
      - SCRAPER_API_KEY=${SCRAPER_API_KEY}
      - SENDGRID_WEBHOOK_PUBLIC_KEY=${SENDGRID_WEBHOOK_PUBLIC_KEY}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379/2
      - UVICORN_WORKERS=${UVICORN_WORKERS:-4}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - client_finder_net
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: client_finder_celery_worker
    restart: always
    # prefork pool is mandatory (multiprocessing.Process + asyncio.run are
    # fork-safe only under prefork). Scale CELERY_CONCURRENCY to server vCPU count;
    # Playwright is RAM-heavy so cap per-child memory accordingly.
    command: sh -c "celery -A app.celery_app:celery_app worker --loglevel=info --concurrency=${CELERY_CONCURRENCY:-4} --pool=prefork --max-memory-per-child=400000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MAPS_API_KEY=${MAPS_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL}
      - SENDGRID_FROM_NAME=${SENDGRID_FROM_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - GMAIL_ADDRESS=${GMAIL_ADDRESS}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      - FRONTEND_URL=${FRONTEND_URL}
      - EMAIL_AGENT_ENABLED=${EMAIL_AGENT_ENABLED}
      - DEFAULT_CREDITS=${DEFAULT_CREDITS}
      - VALUESERP_API_KEY=${VALUESERP_API_KEY}
      - HUNTER_API_KEY=${HUNTER_API_KEY}
      - SCRAPER_API_KEY=${SCRAPER_API_KEY}
      - SENDGRID_WEBHOOK_PUBLIC_KEY=${SENDGRID_WEBHOOK_PUBLIC_KEY}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - REDIS_URL=redis://redis:6379/2
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-4}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - client_finder_net
  redis:
    image: redis:7-alpine
    container_name: client_finder_redis
    restart: always
    # Internal-only (no published ports). noeviction protects queued tasks.
    command: redis-server --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - client_finder_net
  frontend:
    build:
      context: ./front_end
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL}
    container_name: client_finder_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - client_finder_net
  db:
    image: postgres:15-alpine
    container_name: client_finder_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - client_finder_net
  nginx:
    image: nginx:alpine
    container_name: client_finder_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - client_finder_net
volumes:
  pgdata:
  redisdata:
networks:
  client_finder_net:
    driver: bridge
