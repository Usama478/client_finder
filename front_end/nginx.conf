server {
    listen 80;

    # Hashed assets emitted by Vite never change for a given filename, so they
    # can be cached aggressively. The browser learns about new bundles via
    # index.html, which we never let it cache.
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Force the browser to revalidate index.html every load. Without this
        # the SPA can keep loading a stale bundle reference after a deploy,
        # which makes new code (e.g. updated polling logic) appear to "not
        # ship" until the user manually clears cache.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires off;
    }

    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
